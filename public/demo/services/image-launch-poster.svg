<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Sample Co. launch poster</title>
  <desc id="desc">A navy poster with concentric amber arcs rising from the bottom-right corner and the headline Now shipping.</desc>
  <rect width="1200" height="630" fill="#1B2A4A"/>
  <g fill="none" stroke="#F5A623" stroke-width="28">
    <circle cx="1200" cy="630" r="110"/>
    <circle cx="1200" cy="630" r="210"/>
    <circle cx="1200" cy="630" r="310"/>
    <circle cx="1200" cy="630" r="410"/>
  </g>
  <rect x="80" y="84" width="72" height="12" fill="#F5A623"/>
  <text x="80" y="300" font-family="system-ui, sans-serif" font-size="96" font-weight="700" fill="#F6F1E7">Now shipping</text>
  <text x="80" y="372" font-family="system-ui, sans-serif" font-size="36" fill="#F6F1E7">Sample Co. Autumn 2026</text>
  <text x="80" y="560" font-family="system-ui, sans-serif" font-size="20" fill="#F6F1E7" opacity="0.7">sample</text>
