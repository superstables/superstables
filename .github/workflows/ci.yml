# Release candidate pushes to main are type-checked, tested, built and packed. The bundle is built in
# CI and not only at release time, because a manifest that no longer matches the code is a
# failure people only notice when they try to install it.
#
# The tests never reach the network (they stand up their own servers on loopback), so CI needs
# no keys, no funded wallet and no facilitator.

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-release
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Node ${{ matrix.node }}
    runs-on: [self-hosted, Linux, X64, superstables-ci]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle
        run: npm run bundle

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: superstables-mcpb-node${{ matrix.node }}
          path: build/*.mcpb
          if-no-files-found: error
          retention-days: 3
