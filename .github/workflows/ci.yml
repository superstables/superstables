# Release candidate pushes to main are type-checked, tested and built, and the skill zip is built and
# run on its own.
#
# The tests never reach the network (they stand up their own servers on loopback), so CI needs
# no keys, no funded wallet and no facilitator.
#
# The install job installs the client the five ways people do (the packed tarball, a global
# install, a checkout, a checkout without dev packages, a git URL) and runs it, with scripts/install-check.mjs. Its
# `budget doctor` reads a public testnet RPC; everything else stays local.

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-release
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Node ${{ matrix.node }}
    runs-on: [self-hosted, Linux, X64, superstables-ci]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      # The runner's service may use 2 CPUs and 4 GB, but vitest sizes its pool by the machine's cores.
      # Two workers and longer timeouts keep the tests that start the CLI as a process from timing out.
      # The tests write their temporary homes and checkouts to TMPDIR. On the runner /tmp is a small
      # tmpfs shared with everything else on the machine; the job's own temp folder is on disk.
      - name: Test
        run: npm test -- --maxWorkers=2 --minWorkers=1 --testTimeout=60000 --hookTimeout=60000
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Build
        run: npm run build

      # docs/cli.md and docs/cli-budget.md are the commands' --help; this fails when they drift.
      - name: CLI reference matches the help
        run: npm run docs:cli -- --check

      # The skill zip, unpacked outside the checkout and run with node alone. `find` reads the
      # hosted catalogue, the one step here that needs the network.
      - name: Skill zip
        run: npm run skill && npm run skill:check
        env:
          TMPDIR: ${{ runner.temp }}

  install:
    if: github.ref == 'refs/heads/main'
    name: Install routes, Node ${{ matrix.node }}
    runs-on: [self-hosted, Linux, X64, superstables-ci]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["20"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # the git route clones this checkout, and the build stamps the commit count
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install five ways and run
        run: node scripts/install-check.mjs
        env:
          TMPDIR: ${{ runner.temp }}
