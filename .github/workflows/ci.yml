# A quick check of main, started by hand: type-check, the tests without the slow suites, the build,
# and the skill zip built and run on its own. Pushes to main start nothing. Every test, the slow
# suites (the files listed in vitest.config.ts) and the install routes run in ci-full.yml, nightly
# and on demand, and it gates every release.
# It runs only in the private repo; the public copy of this file never starts a job.
#
# The tests never reach the network (they stand up their own servers on loopback), so CI needs
# no keys, no funded wallet and no facilitator.

name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a newer run on main supersedes the older one; a dispatch on another ref skips its jobs, so it gets its own group
  group: ${{ github.ref == 'refs/heads/main' && 'ci-main' || format('ci-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.private && github.ref == 'refs/heads/main'
    name: Node ${{ matrix.node }}
    runs-on: [self-hosted, Linux, X64, superstables-ci]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      # The runner's service may use 2 CPUs and 4 GB, but vitest sizes its pool by the machine's cores.
      # Two workers and longer timeouts keep the tests that start the CLI as a process from timing out.
      # The tests write their temporary homes and checkouts to TMPDIR. On the runner /tmp is a small
      # tmpfs shared with everything else on the machine; the job's own temp folder is on disk.
      - name: Test
        run: npm run test:fast -- --maxWorkers=2 --minWorkers=1 --testTimeout=60000 --hookTimeout=60000
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Build
        run: npm run build

      # docs/cli.md and docs/cli-budget.md are the commands' --help; this fails when they drift.
      - name: CLI reference matches the help
        run: npm run docs:cli -- --check

      # The skill zip, unpacked outside the checkout and run with node alone. `find` reads the
      # hosted catalogue, the one step here that needs the network.
      - name: Skill zip
        run: npm run skill && npm run skill:check
        env:
          TMPDIR: ${{ runner.temp }}
