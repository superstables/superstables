# Every push and pull request is type-checked, tested and built, and the skill zip is built and
# run on its own.
#
# The tests never reach the network (they stand up their own servers on loopback), so CI needs
# no keys, no funded wallet and no facilitator.
#
# The install job installs the client the four ways people do (the packed tarball, a checkout, a
# checkout without dev packages, a git URL) and runs it, with scripts/install-check.mjs. Its
# `budget doctor` reads a public testnet RPC; everything else stays local.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "20" }
          - { os: ubuntu-latest, node: "22" }
          - { os: macos-latest, node: "22" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # docs/cli.md and docs/cli-budget.md are the commands' --help; this fails when they drift.
      - name: CLI reference matches the help
        run: npm run docs:cli -- --check

      # The skill zip, unpacked outside the checkout and run with node alone. `find` reads the
      # hosted catalogue, the one step here that needs the network.
      - name: Skill zip
        run: npm run skill && npm run skill:check

  install:
    name: Install routes, Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "20" }
          - { os: macos-latest, node: "22" }
    steps:
      - uses: actions/checkout@v4
        with:
          # the git route clones this checkout, and the build stamps the commit count
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install four ways and run
        run: node scripts/install-check.mjs
        env:
          TMPDIR: ${{ runner.temp }}
