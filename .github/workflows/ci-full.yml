# The whole suite, the build, the skill zip, an audit of every package the client ships, a check that two builds of
# the commit are identical, and the six install routes, on main, every night and on demand. It is not the release
# gate: superstables-release requires the CI workflow (ci.yml) on the exact commit it releases.
# It runs only in the private repo; the public copy of this file never starts a job.
#
# The tests never reach the network (they stand up their own servers on loopback), so CI needs
# no keys, no funded wallet and no facilitator.
#
# The install job installs the client the six ways people do (the packed tarball, a global
# install, npx from a registry, a checkout, a checkout without dev packages, a git URL) and runs it, with
# scripts/install-check.mjs. Its
# `budget doctor` reads a public testnet RPC; everything else stays local.

name: CI full

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: read

concurrency:
  # a newer full run on main supersedes an older one; a dispatch on another ref skips its jobs
  group: ${{ github.ref == 'refs/heads/main' && 'ci-release' || format('ci-full-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.private && github.ref == 'refs/heads/main'
    name: Node ${{ matrix.node }}
    runs-on: [self-hosted, Linux, X64, superstables-ci]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ["22"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      # The runner's service may use 2 CPUs and 4 GB, but vitest sizes its pool by the machine's cores.
      # Two workers and longer timeouts keep the tests that start the CLI as a process from timing out.
      # The tests write their temporary homes and checkouts to TMPDIR. On the runner /tmp is a small
      # tmpfs shared with everything else on the machine; the job's own temp folder is on disk.
      - name: Test
        run: npm test -- --maxWorkers=2 --minWorkers=1 --testTimeout=60000 --hookTimeout=60000
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Build
        run: npm run build

      # docs/cli.md and docs/cli-budget.md are the commands' --help; this fails when they drift.
      - name: CLI reference matches the help
        run: npm run docs:cli -- --check

      # The skill zip, unpacked outside the checkout and run with node alone. `find` reads the
      # hosted catalogue, the one step here that needs the network.
      - name: Skill zip
        run: npm run skill && npm run skill:check
        env:
          TMPDIR: ${{ runner.temp }}

      # Every package the client installs or bundles (the SBOMs the build and the skill wrote), against the registry's
      # advisories. It fails on an advisory for any of them, and when the registry can't be reached.
      - name: Audit the shipped packages
        run: node scripts/bundle-audit.mjs --sbom dist/sbom.cdx.json --sbom build/skill/superstables-payments/scripts/sbom.cdx.json

  reproducible:
    if: github.event.repository.private && github.ref == 'refs/heads/main'
    name: Two builds are identical, Node ${{ matrix.node }}
    runs-on: [self-hosted, Linux, X64, superstables-ci]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      # This commit built twice the way the release builds it (git archive, npm ci, npm run skill, npm pack), in two
      # folders, time zones and locales: the npm tarball and the skill zip must be byte for byte the same.
      - name: Build twice and compare
        run: node scripts/repro-check.mjs
        env:
          TMPDIR: ${{ runner.temp }}

  install:
    if: github.event.repository.private && github.ref == 'refs/heads/main'
    name: Install routes, Node ${{ matrix.node }}
    runs-on: [self-hosted, Linux, X64, superstables-ci]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # the git route clones this checkout, and the build stamps the commit count
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install six ways and run
        run: node scripts/install-check.mjs
        env:
          TMPDIR: ${{ runner.temp }}
